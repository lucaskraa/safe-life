name: Conferir enquadramento fotográfico da landing
on:
  push:
    paths:
      - '.github/workflows/landing-photo-options.yml'
permissions:
  contents: write
jobs:
  photo-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar alternativas fotográficas licenciadas
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 80 'https://images.pexels.com/photos/16465615/pexels-photo-16465615.jpeg?auto=compress&cs=tinysrgb&w=1800' -o landing-abrigo-hero-opcao.jpg
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 80 'https://images.pexels.com/photos/20049564/pexels-photo-20049564.jpeg?auto=compress&cs=tinysrgb&w=1400' -o landing-abrigo-cta-opcao.jpg
          for asset in landing-abrigo-hero-opcao.jpg landing-abrigo-cta-opcao.jpg; do
            test "$(wc -c < "$asset")" -gt 30000
            file "$asset" | grep -Eiq 'JPEG image data'
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing-abrigo-hero-opcao.jpg landing-abrigo-cta-opcao.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Landing: alternativas fotográficas de animais no abrigo"
            git push
          fi
