name: Instalar fotografias documentais da landing
on:
  push:
    paths:
      - '.github/workflows/landing-documentary-assets.yml'
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fotografias de abrigo licenciadas pelo Pexels
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 'https://images.pexels.com/photos/20049567/pexels-photo-20049567.jpeg?auto=compress&cs=tinysrgb&w=1800' -o landing-abrigo-hero.jpg
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 'https://images.pexels.com/photos/17679591/pexels-photo-17679591.jpeg?auto=compress&cs=tinysrgb&w=1100' -o landing-abrigo-sobre.jpg
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 'https://images.pexels.com/photos/20049569/pexels-photo-20049569.jpeg?auto=compress&cs=tinysrgb&w=1400' -o landing-abrigo-cta.jpg
          for asset in landing-abrigo-hero.jpg landing-abrigo-sobre.jpg landing-abrigo-cta.jpg; do
            test "$(wc -c < "$asset")" -gt 30000
            file "$asset" | grep -Eiq 'JPEG image data'
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing-abrigo-hero.jpg landing-abrigo-sobre.jpg landing-abrigo-cta.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Landing: adicionar fotografias documentais de animais em abrigos"
            git push
          fi
