name: Atualizar fotografia principal do Safe Life
on:
  push:
    paths:
      - '.github/workflows/hero-photo-update.yml'
permissions:
  contents: write
jobs:
  install-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar fotografia real do cachorro e gato
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 'https://images.unsplash.com/photo-1695451486995-7697b5c1be51?auto=format&fit=crop&w=1800&q=84&fm=jpg' -o hero-photo-v2.jpg
          test "$(wc -c < hero-photo-v2.jpg)" -gt 25000
          file hero-photo-v2.jpg | grep -Eiq 'jpeg|image data'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-photo-v2.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Assets: trocar fotografia principal por cão e gato"
            git push
          fi
