<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Recuperar Safe Life</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top, #dbeafe, transparent 42%),
                linear-gradient(145deg, #f8fafc, #eef2ff);
            color: #0f172a;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(100%, 440px);
            padding: 28px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
            text-align: center;
        }

        .icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 24px;
            background: #dcfce7;
            font-size: 34px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 26px;
        }

        p {
            margin: 0 0 22px;
            color: #475569;
            line-height: 1.55;
        }

        button,
        a {
            width: 100%;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #2454d6;
            color: #ffffff;
        }

        a {
            margin-top: 12px;
            background: #e2e8f0;
            color: #0f172a;
        }

        #status {
            min-height: 24px;
            margin-top: 18px;
            font-weight: 700;
            color: #166534;
        }
    </style>
</head>
<body>
    <main>
        <div class="icon">🛠️</div>
        <h1>Recuperar Safe Life</h1>
        <p>
            Esta página limpa somente o login salvo neste aparelho.
            A conta continua cadastrada no banco de dados.
        </p>

        <button type="button" id="resetButton">
            Limpar sessão e voltar ao login
        </button>

        <a href="index.html?v=18.5.0">
            Voltar sem limpar
        </a>

        <div id="status"></div>
    </main>

    <script>
        function removeSafeLifeStorage() {
            const localKeys = [];

            for (let index = 0; index < localStorage.length; index += 1) {
                const key = localStorage.key(index);

                if (
                    key &&
                    key.toLowerCase().startsWith("safelife")
                ) {
                    localKeys.push(key);
                }
            }

            localKeys.forEach(function (key) {
                localStorage.removeItem(key);
            });

            const sessionKeys = [];

            for (let index = 0; index < sessionStorage.length; index += 1) {
                const key = sessionStorage.key(index);

                if (
                    key &&
                    key.toLowerCase().startsWith("safelife")
                ) {
                    sessionKeys.push(key);
                }
            }

            sessionKeys.forEach(function (key) {
                sessionStorage.removeItem(key);
            });
        }

        document
            .getElementById("resetButton")
            .addEventListener("click", async function () {
                const status = document.getElementById("status");
                status.textContent = "Limpando o login salvo...";

                removeSafeLifeStorage();

                if ("serviceWorker" in navigator) {
                    const registrations =
                        await navigator.serviceWorker.getRegistrations();

                    await Promise.all(
                        registrations.map(function (registration) {
                            return registration.unregister();
                        })
                    );
                }

                if ("caches" in window) {
                    const names = await caches.keys();

                    await Promise.all(
                        names.map(function (name) {
                            return caches.delete(name);
                        })
                    );
                }

                status.textContent = "Pronto. Abrindo a tela de login...";

                window.setTimeout(function () {
                    window.location.replace(
                        "index.html?v=18.5.0&recovered=1"
                    );
                }, 700);
            });
    </script>
</body>
</html>
